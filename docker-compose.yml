version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ticketing_db
    environment:
      POSTGRES_USER: ticketing_user
      POSTGRES_PASSWORD: ticketing_password
      POSTGRES_DB: ticketing_app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketing_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: ticketing_backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ticketing_user:ticketing_password@postgres:5432/ticketing_app
      JWT_SECRET: your-secret-key-change-in-production
      BACKEND_PORT: 5000
      NODE_ENV: development
      FRONTEND_URL: http://localhost:3000
      # GitHub image storage (optional — uses local disk when unset)
      # GITHUB_TOKEN: ghp_xxx
      # GITHUB_OWNER: your-github-username
      # GITHUB_REPO: ticket-attachments
      # GITHUB_BRANCH: main
      # GITHUB_UPLOAD_PATH: tickets
    ports:
      - "5000:5000"
    volumes:
      - ./backend/src:/app/src
      - backend_uploads:/app/uploads
    command: pnpm dev

  frontend:
    build: ./frontend
    container_name: ticketing_frontend
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
    command: pnpm start

volumes:
  postgres_data:
  backend_uploads:
