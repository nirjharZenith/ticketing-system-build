name: Production Pipeline

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-backend

jobs:
  quality-gates:
    name: Lint, Test, and Scan
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4.1.7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.0.0
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'pnpm'

      - name: Install Dependencies (Backend)
        run: pnpm --dir backend install --frozen-lockfile

      - name: Install Dependencies (Frontend)
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Backend Tests
        run: pnpm --dir backend test:ci

      - name: Frontend Tests
        env:
          CI: true
        run: pnpm --dir frontend test

      - name: Security Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'

  build-backend:
    name: Build & Push Backend Artifact
    needs: quality-gates
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4.1.7

      - name: Log in to the Container registry
        uses: docker/login-action@v3.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5.5.1
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.3.0

      - name: Build and push Docker image
        uses: docker/build-push-action@v5.3.0
        with:
          context: ./backend
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build Frontend Artifact
    needs: quality-gates
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4.1.7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.0.0
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Build Frontend
        env:
          REACT_APP_API_URL: ${{ secrets.PROD_API_URL }}
        run: pnpm --dir frontend build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4.3.3
        with:
          name: frontend-build
          path: frontend/build/
          retention-days: 1

  deploy-backend:
    name: Deploy Backend to Render
    needs: build-backend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-22.04
    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -X POST -d "" "$RENDER_DEPLOY_HOOK_URL"

      - name: Smoke Test Backend
        run: |
          echo "Waiting for Render to pull new image and deploy..."
          sleep 60
          curl -f "${{ secrets.BACKEND_PROD_URL }}/api/auth/me" || exit 1

  deploy-frontend:
    name: Deploy Frontend to Vercel
    needs: build-frontend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4.1.7

      - name: Download Frontend Build
        uses: actions/download-artifact@v4.1.7
        with:
          name: frontend-build
          path: .vercel/output/static

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25.2.0
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./
          vercel-args: '--prebuilt --prod'

      - name: Smoke Test Frontend
        run: |
          sleep 10
          curl -f "${{ secrets.FRONTEND_PROD_URL }}" || exit 1
